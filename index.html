<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prank Call Studio</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .studio-card { background: linear-gradient(180deg, #131b2e 0%, #0d1322 100%); border: 1px solid #1e293b; border-radius: 24px; width: 100%; max-width: 420px; padding: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; }
        .header-title { display: flex; align-items: center; gap: 12px; }
        .icon-box { width: 44px; height: 44px; background: linear-gradient(135deg, #6366f1, #8b5cf6); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .badge { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status-display { text-align: center; margin-bottom: 20px; }
        .status-tag { color: #38bdf8; font-size: 11px; letter-spacing: 1.5px; font-weight: 700; text-transform: uppercase; margin-bottom: 5px; }
        .number-input { width: 100%; background: transparent; border: none; color: #ffffff; font-size: 28px; font-weight: 700; text-align: center; margin-bottom: 15px; outline: none; }
        .msg-input { width: 100%; background: #090d16; border: 1px solid #1e293b; border-radius: 12px; color: #fff; padding: 12px; font-size: 14px; margin-bottom: 20px; resize: none; text-align: center; outline: none; }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
        .key { background: #172033; border: 1px solid #23304a; border-radius: 16px; height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.1s; }
        .key:active { background: #23304a; transform: scale(0.96); }
        .key-num { font-size: 20px; font-weight: 600; }
        .key-sub { font-size: 9px; color: #64748b; letter-spacing: 1px; }
        .actions { display: flex; justify-content: space-around; align-items: center; }
        .action-btn { width: 56px; height: 56px; border-radius: 50%; background: #172033; border: 1px solid #23304a; color: #94a3b8; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; }
        .call-btn { width: 68px; height: 68px; border-radius: 50%; background: #10b981; border: none; color: #fff; font-size: 24px; cursor: pointer; box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); display: flex; align-items: center; justify-content: center; }
        .call-btn:active { transform: scale(0.95); }
        .log-status { font-size: 12px; text-align: center; margin-top: 15px; min-height: 18px; color: #64748b; }
    </style>
</head>
<body>

<div class="studio-card">
    <div class="header">
        <div class="header-title">
            <div class="icon-box"><i class="fa-solid fa-phone-volume"></i></div>
            <div>
                <h3 style="font-size: 16px;">Prank Call Studio</h3>
                <span style="font-size: 11px; color: #64748b;">Free Call Generator</span>
            </div>
        </div>
        <div class="badge">جاهز للاستخدام</div>
    </div>

    <div class="status-display">
        <div class="status-tag" id="statusTag">أدخل رقم الهاتف</div>
        <input type="text" class="number-input" id="phoneInput" placeholder="002011..." readonly>
    </div>

    <textarea class="msg-input" id="messageInput" rows="2" placeholder="اكتب نص الرسالة هنا..."></textarea>

    <div class="keypad">
        <div class="key" onclick="pressKey('1')"><span class="key-num">1</span><span class="key-sub">&nbsp;</span></div>
        <div class="key" onclick="pressKey('2')"><span class="key-num">2</span><span class="key-sub">ABC</span></div>
        <div class="key" onclick="pressKey('3')"><span class="key-num">3</span><span class="key-sub">DEF</span></div>
        <div class="key" onclick="pressKey('4')"><span class="key-num">4</span><span class="key-sub">GHI</span></div>
        <div class="key" onclick="pressKey('5')"><span class="key-num">5</span><span class="key-sub">JKL</span></div>
        <div class="key" onclick="pressKey('6')"><span class="key-num">6</span><span class="key-sub">MNO</span></div>
        <div class="key" onclick="pressKey('7')"><span class="key-num">7</span><span class="key-sub">PQRS</span></div>
        <div class="key" onclick="pressKey('8')"><span class="key-num">8</span><span class="key-sub">TUV</span></div>
        <div class="key" onclick="pressKey('9')"><span class="key-num">9</span><span class="key-sub">WXYZ</span></div>
        <div class="key" onclick="pressKey('*')"><span class="key-num">*</span><span class="key-sub"></span></div>
        <div class="key" onclick="pressKey('0')"><span class="key-num">0</span><span class="key-sub">+</span></div>
        <div class="key" onclick="pressKey('#')"><span class="key-num">#</span><span class="key-sub"></span></div>
    </div>

    <div class="actions">
        <button class="action-btn" onclick="clearPhone()"><i class="fa-solid fa-xmark"></i></button>
        <button class="call-btn" onclick="makeCall()"><i class="fa-solid fa-phone"></i></button>
        <button class="action-btn" onclick="backspace()"><i class="fa-solid fa-delete-left"></i></button>
    </div>

    <div class="log-status" id="logStatus"></div>
</div>

<script>
    const phoneInput = document.getElementById('phoneInput');
    const messageInput = document.getElementById('messageInput');
    const logStatus = document.getElementById('logStatus');
    const statusTag = document.getElementById('statusTag');

    function pressKey(val) {
        phoneInput.value += val;
    }

    function clearPhone() {
        phoneInput.value = '';
        logStatus.innerText = '';
        statusTag.innerText = 'أدخل رقم الهاتف';
    }

    function backspace() {
        phoneInput.value = phoneInput.value.slice(0, -1);
    }

    async function makeCall() {
        const phone = phoneInput.value.trim();
        const message = messageInput.value.trim();

        if (!phone) {
            logStatus.style.color = '#f87171';
            logStatus.innerText = 'يرجى إدخال رقم هاتف أولاً';
            return;
        }

        logStatus.style.color = '#38bdf8';
        logStatus.innerText = 'جاري إنتاج رابط المكالمة المجانية...';
        statusTag.innerText = 'جاري التحضير';

        const roomId = 'prank-' + Math.floor(100000 + Math.random() * 900000);
        const callUrl = `https://meet.jit.si/${roomId}`;

        try {
            await navigator.clipboard.writeText(callUrl);
            logStatus.style.color = '#34d399';
            logStatus.innerText = 'تم إنشاء الرابط ونسخه بنجاح! 🚀';
            statusTag.innerText = 'جاهز للمشاركة';

            alert(`تم نسخ رابط المكالمة المجانية بنجاح:\n\n${callUrl}\n\nأرسل هذا الرابط لصديقك وافتحا الرابط معاً للبدء بالمكالمة!`);
        } catch (err) {
            logStatus.style.color = '#34d399';
            logStatus.innerText = 'رابط المكالمة: ' + callUrl;
            alert(`رابط المكالمة المجانية:\n\n${callUrl}\n\nقم بنسخه وأرسله لصديقك!`);
        }
    }
</script>

</body>
</html>
