<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prank Call Studio</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .studio-card { background: linear-gradient(180deg, #131b2e 0%, #0d1322 100%); border: 1px solid #1e293b; border-radius: 24px; width: 100%; max-width: 420px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; }
        .header-title { display: flex; align-items: center; gap: 12px; }
        .icon-box { width: 44px; height: 44px; background: linear-gradient(135deg, #6366f1, #8b5cf6); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .badge { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status-display { text-align: center; margin-bottom: 20px; }
        .status-tag { color: #38bdf8; font-size: 11px; letter-spacing: 1.5px; font-weight: 700; text-transform: uppercase; }
        .number-input { width: 100%; background: transparent; border: none; color: #ffffff; font-size: 28px; font-weight: 700; text-align: center; margin: 8px 0; outline: none; direction: ltr; }
        .msg-input { width: 100%; background: #090d16; border: 1px solid #1e2d4a; border-radius: 12px; color: #fff; padding: 12px; font-size: 14px; margin-bottom: 20px; resize: none; outline: none; }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
        .key { background: #172033; border: 1px solid #23304a; border-radius: 16px; height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; user-select: none; transition: all 0.15s ease; }
        .key:active { background: #23304a; transform: scale(0.96); }
        .key-num { font-size: 20px; font-weight: 600; }
        .key-sub { font-size: 9px; color: #64748b; letter-spacing: 1px; }
        .actions { display: flex; justify-content: space-around; align-items: center; }
        .action-btn { width: 50px; height: 50px; border-radius: 50%; background: #172033; border: 1px solid #23304a; color: #94a3b8; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; }
        .call-btn { width: 64px; height: 64px; border-radius: 50%; background: #10b981; box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); border: none; color: white; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.2s; }
        .call-btn:hover { transform: scale(1.05); background: #059669; }
        #log-status { text-align: center; font-size: 13px; margin-top: 15px; min-height: 20px; }
    </style>
</head>
<body>

<div class="studio-card">
    <div class="header">
        <div class="header-title">
            <div class="icon-box"><i class="fa-solid fa-phone-volume"></i></div>
            <div>
                <h3 style="font-size: 16px;">Prank Call Studio</h3>
                <p style="font-size: 11px; color: #64748b;">Real Calling Engine</p>
            </div>
        </div>
        <div class="badge">Vercel Ready</div>
    </div>

    <div class="status-display">
        <div class="status-tag" id="status-tag">جاهز للاتصال</div>
        <input type="text" id="phone-number" class="number-input" placeholder="+201xxxxxxxxx" readonly>
    </div>

    <textarea id="message" class="msg-input" rows="3" placeholder="اكتب النص الذي سيسمعه المتصل عليه عند الرد..."></textarea>

    <div class="keypad">
        <div class="key" onclick="press('1')"><span class="key-num">1</span><span class="key-sub">&nbsp;</span></div>
        <div class="key" onclick="press('2')"><span class="key-num">2</span><span class="key-sub">ABC</span></div>
        <div class="key" onclick="press('3')"><span class="key-num">3</span><span class="key-sub">DEF</span></div>
        <div class="key" onclick="press('4')"><span class="key-num">4</span><span class="key-sub">GHI</span></div>
        <div class="key" onclick="press('5')"><span class="key-num">5</span><span class="key-sub">JKL</span></div>
        <div class="key" onclick="press('6')"><span class="key-num">6</span><span class="key-sub">MNO</span></div>
        <div class="key" onclick="press('7')"><span class="key-num">7</span><span class="key-sub">PQRS</span></div>
        <div class="key" onclick="press('8')"><span class="key-num">8</span><span class="key-sub">TUV</span></div>
        <div class="key" onclick="press('9')"><span class="key-num">9</span><span class="key-sub">WXYZ</span></div>
        <div class="key" onclick="press('*')"><span class="key-num">*</span><span class="key-sub"></span></div>
        <div class="key" onclick="press('0')"><span class="key-num">0</span><span class="key-sub">+</span></div>
        <div class="key" onclick="press('#')"><span class="key-num">#</span><span class="key-sub"></span></div>
    </div>

    <div class="actions">
        <button class="action-btn" onclick="backspace()"><i class="fa-solid fa-backspace"></i></button>
        <button class="call-btn" onclick="makeRealCall()"><i class="fa-solid fa-phone"></i></button>
        <button class="action-btn" onclick="clearAll()"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div id="log-status"></div>
</div>

<script>
    const phoneInput = document.getElementById('phone-number');
    const logStatus = document.getElementById('log-status');
    const statusTag = document.getElementById('status-tag');

    function press(val) { phoneInput.value += val; }
    function backspace() { phoneInput.value = phoneInput.value.slice(0, -1); }
    function clearAll() { phoneInput.value = ''; }

    async function makeRealCall() {
        const phone = phoneInput.value.trim();
        const message = document.getElementById('message').value.trim();

        if (!phone || !message) {
            logStatus.style.color = '#f87171';
            logStatus.innerText = 'يرجى إدخال الرقم والنص المكتوب!';
            return;
        }

        logStatus.style.color = '#38bdf8';
        logStatus.innerText = 'جاري إرسال طلب الاتصال بالشبكة...';
        statusTag.innerText = 'جاري الاتصال...';

        try {
            const res = await fetch('/api/make-call', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phoneNumber: phone, message: message })
            });

            const data = await res.json();

            if (data.success) {
                logStatus.style.color = '#34d399';
                logStatus.innerText = 'تم إجراء الاتصال بنجاح! 🚀';
                statusTag.innerText = 'جاري الرن الآن';
            } else {
                logStatus.style.color = '#f87171';
                logStatus.innerText = 'خطأ: ' + data.error;
                statusTag.innerText = 'فشل الاتصال';
            }
        } catch (e) {
            logStatus.style.color = '#f87171';
            logStatus.innerText = 'فشل في الاتصال بالـ Serverless API';
            statusTag.innerText = 'خطأ شبكة';
        }
    }
</script>

</body>
</html>
